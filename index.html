<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بوابة المؤتمر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;600;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0E1621;--surface:#16202D;--raised:#1D2937;--line:#28374A;
  --amber:#E8B14C;--teal:#4FD1A5;--coral:#FF6B6B;--warn:#F0B429;
  --text:#E9EEF4;--muted:#8496AB;--faint:#5A6B80;--r:14px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--ink);color:var(--text);
  font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;font-size:15px;line-height:1.6;
  padding:18px 14px calc(40px + env(safe-area-inset-bottom));min-height:100vh;
  background-image:radial-gradient(700px 420px at 50% -8%,#1B2A3D 0%,transparent 62%)}
.wrap{max-width:560px;margin:0 auto}
h1{font-family:"Readex Pro",sans-serif;font-weight:600;font-size:23px;text-align:center}
h1 span{color:var(--amber)}
.lead{color:var(--muted);font-size:13px;text-align:center;margin:4px 0 16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:13px}
.hidden{display:none!important}

.btn{width:100%;background:var(--amber);color:#15202C;border:0;border-radius:11px;
  padding:14px;font:inherit;font-size:15.5px;font-weight:700;cursor:pointer;transition:.15s}
.btn:hover{background:#F0BF63}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line);font-weight:500}
.btn.ghost:hover{border-color:var(--amber);background:var(--raised)}
.btn.ok{background:var(--teal);color:#0B2119}
.btn.ok:hover{background:#63DDB4}
.btn+.btn{margin-top:9px}
.rowb{display:flex;gap:9px}.rowb .btn{margin-top:0}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

.top{display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:9px 13px;margin-bottom:13px;font-size:13px}
.top .who{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .sup{color:var(--amber);font-weight:600}
.top button{background:transparent;border:1px solid var(--line);color:var(--muted);
  border-radius:8px;padding:5px 10px;font:inherit;font-size:12px;cursor:pointer;white-space:nowrap}
.top button:hover{border-color:var(--amber);color:var(--text)}

.pick{display:flex;flex-direction:column;gap:9px}
.pick button{background:var(--raised);border:1px solid var(--line);color:var(--text);
  border-radius:11px;padding:16px;font:inherit;font-size:16px;font-weight:600;cursor:pointer;transition:.15s}
.pick button:hover{border-color:var(--amber);background:#26333F}

.stage{position:relative;border-radius:12px;overflow:hidden;background:#0A121B;aspect-ratio:4/3}
video{width:100%;height:100%;object-fit:cover;display:block}
.frame{position:absolute;inset:15%;border:2px solid rgba(232,177,76,.7);border-radius:14px;pointer-events:none}
.off{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:var(--muted);font-size:13px;text-align:center;padding:22px;line-height:1.8}

label{display:block;color:var(--muted);font-size:12.5px;margin-bottom:6px}
input{width:100%;background:#111C27;color:var(--text);border:1px solid var(--line);
  border-radius:10px;padding:13px 15px;font:inherit;font-size:17px;outline:none}
input:focus{border-color:var(--amber)}
input#idm{letter-spacing:.07em}
input#amt{font-family:"Readex Pro",sans-serif;font-size:24px;text-align:center;font-weight:600}

.res{border-radius:var(--r);padding:18px;margin-bottom:13px;border:1px solid}
.res.g{background:rgba(79,209,165,.10);border-color:rgba(79,209,165,.45)}
.res.r{background:rgba(255,107,107,.10);border-color:rgba(255,107,107,.45)}
.res.y{background:rgba(240,180,41,.10);border-color:rgba(240,180,41,.45)}
.res .nm{font-family:"Readex Pro",sans-serif;font-size:22px;font-weight:600;line-height:1.35}
.res .idl{color:var(--faint);font-size:12.5px;letter-spacing:.08em;margin-top:2px}
.res .big{font-family:"Readex Pro",sans-serif;font-size:44px;font-weight:700;line-height:1.1;margin:12px 0 2px}
.res.g .big{color:var(--teal)}.res.r .big{color:var(--coral)}.res.y .big{color:var(--warn)}
.res .cap{color:var(--muted);font-size:12.5px}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px;
  padding-top:13px;border-top:1px solid rgba(255,255,255,.08)}
.meta div{font-size:13px}
.meta .k{color:var(--faint);font-size:11.5px;display:block}
.num{font-variant-numeric:tabular-nums}

.msg{text-align:center;font-size:13.5px;min-height:21px;margin-top:9px;color:var(--teal)}
.msg.bad{color:var(--coral)}.msg.wait{color:var(--muted)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);
  border-top-color:var(--amber);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-inline-end:6px}
@keyframes sp{to{transform:rotate(360deg)}}

.logh{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.logh h2{font-family:"Readex Pro",sans-serif;font-size:14.5px;font-weight:400}
.logh .n{color:var(--faint);font-size:12px}
.log{display:flex;flex-direction:column;gap:5px;max-height:200px;overflow-y:auto}
.li{display:grid;grid-template-columns:1fr auto auto;gap:9px;align-items:center;
  background:var(--raised);border-radius:8px;padding:8px 11px;font-size:13px}
.li .v{font-family:"Readex Pro",sans-serif;font-size:12.5px;letter-spacing:.05em;color:var(--muted)}
.li .a{color:var(--teal);font-variant-numeric:tabular-nums;font-weight:600}
.li .t{color:var(--faint);font-size:11px}
.note{color:var(--faint);font-size:11.5px;line-height:1.8;margin-top:14px;text-align:center}
.evsel{width:100%;background:#111C27;color:var(--text);border:1px solid var(--line);border-radius:11px;padding:13px;font:inherit;font-size:16px}
.evsel:focus{border-color:var(--amber);outline:none}
</style>
</head>
<body>
<div class="wrap">

<!-- ═══ تسجيل الدخول ═══ -->
<section id="vLogin">
  <h1>بوابة <span>المؤتمر</span></h1>
  <p class="lead">سجّل الدخول بحساب العمل للبدء</p>
  <div class="card">
    <button class="btn" id="bLogin">تسجيل الدخول بحساب Microsoft</button>
    <div class="msg" id="mLogin"></div>
  </div>
</section>

<!-- ═══ اختيار المورد ═══ -->
<section id="vPick" class="hidden">
  <h1>اختر <span>المورد</span></h1>
  <p class="lead">سيتم البحث والتسجيل في ملف هذا المورد</p>
  <div class="card"><div class="pick" id="pick"></div></div>
  <div class="msg" id="mPick"></div>
</section>

<!-- ═══ المسح ═══ -->
<section id="vScan" class="hidden">
  <div class="top">
    <span class="who">المورد: <span class="sup" id="tSup"></span></span>
    <button id="bSwitch">تبديل</button>
  </div>

  <div class="card">
    <label for="evt">الفعالية الحالية</label>
    <select id="evt" class="evsel"></select>
  </div>

  <div class="card">
    <div class="stage">
      <video id="vid" playsinline muted></video>
      <div class="frame hidden" id="frm"></div>
      <div class="off" id="off">اضغط «شغّل الكاميرا» لبدء المسح</div>
    </div>
    <button class="btn" id="bCam" style="margin-top:11px">شغّل الكاميرا</button>
  </div>

  <div class="card">
    <label for="idm">أو اكتب المعرف يدويًا</label>
    <input id="idm" placeholder="HD443322" autocomplete="off" spellcheck="false" enterkeyhint="search">
    <button class="btn ghost" id="bFind" style="margin-top:10px">ابحث</button>
    <div class="msg" id="mFind"></div>
  </div>

  <!-- النتيجة -->
  <div id="result"></div>

  <div class="card hidden" id="confirmBox">
    <label for="amt">المبلغ المستخدم</label>
    <input id="amt" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0">
    <div class="rowb" style="margin-top:11px">
      <button class="btn ok" id="bConfirm" style="flex:2">تأكيد وتسجيل</button>
      <button class="btn ghost" id="bCancel" style="flex:1">إلغاء</button>
    </div>
    <div class="msg" id="mSave"></div>
  </div>

  <div class="card">
    <div class="logh"><h2>سجل الجلسة</h2><span class="n" id="cnt">0</span></div>
    <div class="log" id="log"></div>
  </div>

  <p class="note">كل تسجيل يُكتب سطراً جديداً في ورقة «سجل المقاعد» مع التاريخ والوقت والفعالية.</p>
</section>

</div>

<script>
/* ═══════════════ الإعدادات ═══════════════ */
const CFG = {
  clientId : "b92e1e1c-b978-4675-a5b4-12d738463406",
  tenantId : "add292fe-6f9c-4c4b-b345-1ee796e7da71",
  redirect : "https://ahmednobed1993-art.github.io/scan/",
  scope    : "openid profile offline_access User.Read Files.ReadWrite.All",
  sheet    : "المقاعد",
  logSheet : "سجل المقاعد",
  salesSheet:"المبيعات",
  setSheet : "الإعدادات",
  range    : "A1:J1501",
  suppliers: [
    {name:"مرتضى", url:"https://achievers544-my.sharepoint.com/:x:/g/personal/ahmednajim_achievers544_onmicrosoft_com/IQDvBvVdW1KqSptZfDhy26qlAc1_IpJmXk1D5NdGyf2Ksbg?e=DsLoWr"},
    {name:"عقيل",  url:"https://achievers544-my.sharepoint.com/:x:/g/personal/ahmednajim_achievers544_onmicrosoft_com/IQBEewHSUIETR4NHmKO170EQAZxOAAuh200uFJjLLJvcOsA?e=OLRnWe"}
  ]
};
const GRAPH="https://graph.microsoft.com/v1.0";
const AUTH=`https://login.microsoftonline.com/${CFG.tenantId}/oauth2/v2.0`;

/* ═══════════════ أدوات ═══════════════ */
const $=s=>document.querySelector(s);
const show=id=>["vLogin","vPick","vScan"].forEach(v=>$("#"+v).classList.toggle("hidden",v!==id));
const clean=s=>String(s||"").trim().toUpperCase().replace(/\s+/g,"");
const num=v=>{const x=typeof v==="number"?v:parseFloat(String(v??"").replace(/[^\d.-]/g,""));return isFinite(x)?x:0};
const fmt=v=>Number(v).toLocaleString("en-US",{maximumFractionDigits:2});
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function say(el,t,cls){el.className="msg"+(cls?" "+cls:"");el.innerHTML=t;}
function busy(el,t){say(el,`<span class="spin"></span>${t}`,"wait")}

/* ═══════════════ مصادقة PKCE ═══════════════ */
const S={get t(){try{return JSON.parse(sessionStorage.gate_tok||"null")}catch(e){return null}},
         set t(v){v?sessionStorage.gate_tok=JSON.stringify(v):sessionStorage.removeItem("gate_tok")}};
const b64u=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const rnd=n=>b64u(crypto.getRandomValues(new Uint8Array(n)));
async function sha(s){return b64u(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s)))}

async function login(){
  const ver=rnd(48), st=rnd(12);
  sessionStorage.gate_ver=ver; sessionStorage.gate_st=st;
  const p=new URLSearchParams({client_id:CFG.clientId,response_type:"code",
    redirect_uri:CFG.redirect,response_mode:"query",scope:CFG.scope,
    state:st,code_challenge:await sha(ver),code_challenge_method:"S256"});
  location.href=`${AUTH}/authorize?${p}`;
}
async function tokenReq(body){
  const r=await fetch(`${AUTH}/token`,{method:"POST",
    headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:new URLSearchParams({client_id:CFG.clientId,...body})});
  const j=await r.json();
  if(!r.ok)throw new Error(j.error_description||j.error||"فشل المصادقة");
  j.exp=Date.now()+(j.expires_in-120)*1000; S.t=j; return j;
}
async function handleRedirect(){
  const q=new URLSearchParams(location.search);
  if(q.get("error")){say($("#mLogin"),esc(q.get("error_description")||q.get("error")),"bad");
    history.replaceState({},"",location.pathname);return false}
  const code=q.get("code");
  if(!code)return false;
  if(q.get("state")!==sessionStorage.gate_st){say($("#mLogin"),"حالة غير مطابقة — أعد المحاولة.","bad");return false}
  busy($("#mLogin"),"جارٍ إكمال تسجيل الدخول…");
  try{
    await tokenReq({grant_type:"authorization_code",code,redirect_uri:CFG.redirect,
      code_verifier:sessionStorage.gate_ver,scope:CFG.scope});
    history.replaceState({},"",location.pathname);
    return true;
  }catch(e){say($("#mLogin"),esc(e.message),"bad");
    history.replaceState({},"",location.pathname);return false}
}
async function token(){
  const t=S.t;
  if(!t)throw new Error("غير مسجّل الدخول");
  if(Date.now()<t.exp)return t.access_token;
  if(!t.refresh_token){S.t=null;throw new Error("انتهت الجلسة — سجّل الدخول من جديد")}
  const n=await tokenReq({grant_type:"refresh_token",refresh_token:t.refresh_token,scope:CFG.scope});
  return n.access_token;
}
async function api(path,opt={}){
  const tk=await token();
  const r=await fetch(path.startsWith("http")?path:GRAPH+path,{...opt,
    headers:{Authorization:"Bearer "+tk,"Content-Type":"application/json",...(opt.headers||{})}});
  if(r.status===204)return null;
  const j=await r.json().catch(()=>({}));
  if(!r.ok){
    const m=j.error?.message||r.statusText;
    if(r.status===401){S.t=null;throw new Error("انتهت الجلسة — سجّل الدخول من جديد")}
    if(r.status===403)throw new Error("الكتابة مرفوضة — تأكد أن لديك صلاحية تعديل على ملف هذا المورد.");
    throw new Error(m);
  }
  return j;
}

/* ═══════════════ حالة التشغيل ═══════════════ */
let SUP=null, FILE=null, ROWS=null, HIT=null, EVENTS=[];
const items=[];

function shareId(url){
  const b=btoa(unescape(encodeURIComponent(url)));
  return "u!"+b.replace(/=+$/,"").replace(/\//g,"_").replace(/\+/g,"-");
}
async function openFile(sup){
  if(!/^https?:/.test(sup.url))throw new Error("رابط ملف "+sup.name+" غير مضاف بالكود.");
  const d=await api(`/shares/${shareId(sup.url)}/driveItem`);
  return {driveId:d.parentReference.driveId,itemId:d.id,name:d.name};
}
const WB=()=>`/drives/${FILE.driveId}/items/${FILE.itemId}/workbook`;
const SH=n=>`${WB()}/worksheets('${encodeURIComponent(n)}')`;

async function loadRows(){
  const r=await api(`${SH(CFG.sheet)}/range(address='${CFG.range}')?$select=values`);
  ROWS=r.values||[];
}
function findRow(id){
  for(let i=1;i<ROWS.length;i++){
    if(clean(ROWS[i][0])===id)return {i,row:i+1,v:ROWS[i]};
  }
  return null;
}
async function inSales(id){
  try{
    const r=await api(`${SH(CFG.salesSheet)}/range(address='C1:F3001')?$select=values`);
    const v=r.values||[]; let hit=null;
    for(let i=1;i<v.length;i++) if(clean(v[i][1])===id){hit={name:v[i][0]||"",st:String(v[i][3]||"").trim()}; if(hit.st==="تم الشراء")break}
    return hit;
  }catch(e){}
  return null;
}
async function loadEvents(){
  const r=await api(`${SH(CFG.setSheet)}/range(address='M2:M101')?$select=values`);
  EVENTS=(r.values||[]).map(x=>String(x[0]??"").trim()).filter(Boolean);
  const sel=$("#evt"); sel.innerHTML="";
  if(!EVENTS.length){sel.add(new Option("لا توجد فعاليات — أضفها بورقة الإعدادات",""));sel.disabled=true;return}
  sel.disabled=false; sel.add(new Option("— اختر الفعالية —",""));
  EVENTS.forEach(e=>sel.add(new Option(e,e)));
  const last=sessionStorage.gate_evt; if(last&&EVENTS.includes(last))sel.value=last;
}

/* ═══════════════ الواجهة ═══════════════ */
function renderLog(){
  $("#cnt").textContent=items.length;
  $("#log").innerHTML=items.map(x=>`<div class="li">
    <span><b>${esc(x.n)}</b><br><span class="v">${esc(x.id)}${x.ev?" · "+esc(x.ev):""}</span></span>
    <span class="a num">+${fmt(x.a)}</span><span class="t">${x.t}</span></div>`).join("")
    ||`<div style="color:var(--faint);font-size:12.5px;text-align:center;padding:12px">لا تسجيلات بعد</div>`;
}
function clearResult(){HIT=null;$("#result").innerHTML="";$("#confirmBox").classList.add("hidden");say($("#mSave"),"")}

function paint(kind,{name,id,big,cap,meta}){
  $("#result").innerHTML=`<div class="res ${kind}">
    <div class="nm">${esc(name)}</div><div class="idl num">${esc(id)}</div>
    <div class="big num">${big}</div><div class="cap">${cap}</div>
    ${meta?`<div class="meta">${meta}</div>`:""}</div>`;
}

async function lookup(id){
  id=clean(id);
  if(!/^[A-Z0-9][A-Z0-9\-]{2,23}$/.test(id)){say($("#mFind"),"معرف غير صالح","bad");return}
  clearResult(); busy($("#mFind"),"جارٍ البحث…");
  try{
    if(!ROWS)await loadRows();
    let f=findRow(id);
    if(!f){ await loadRows(); f=findRow(id); }
    if(!f){
      const h=await inSales(id);
      const cap=!h?"هذا المعرف غير موجود في ملف هذا المورد"
        :h.st==="تم الاسترجاع"?"هذا المقعد تم استرجاعه — لا يُحتسب"
        :h.st!=="تم الشراء"?`موجود في المبيعات بحالة «${esc(h.st)}» — بلا مقعد`
        :"موجود في المبيعات لكن بلا مقعد";
      paint(h&&h.st==="تم الاسترجاع"?"r":"y",{name:(h&&h.name)||"غير مسجّل",id,big:h&&h.st==="تم الاسترجاع"?"مسترجع":"—",cap});
      say($("#mFind"),"");return;
    }
    const v=f.v;
    const dep=num(v[4]),used=num(v[5]),rem=num(v[6]);
    const lastScan=typeof v[8]==="number"?xlDate(v[8]):"";
    const meta=`<div><span class="k">الابلاين</span>${esc(v[2]||"—")}</div>
      <div><span class="k">المورد</span>${esc(v[3]||"—")}</div>
      <div><span class="k">المقعد المودع</span><span class="num">${fmt(dep)}</span></div>
      <div><span class="k">المستخدم سابقًا</span><span class="num">${fmt(used)}</span></div>
      ${lastScan?`<div><span class="k">آخر مسح</span><span class="num">${lastScan}</span></div><div><span class="k">آخر فعالية</span>${esc(v[9]||"—")}</div>`:""}`;
    if(rem>0){
      paint("g",{name:v[1]||"—",id,big:fmt(rem),cap:"الرصيد المتبقي — يمكن التسجيل",meta});
      HIT={row:f.row,id,name:v[1]||"—",dep,used,rem};
      $("#amt").value=""; $("#amt").max=rem;
      $("#confirmBox").classList.remove("hidden");
      setTimeout(()=>$("#amt").focus(),80);
    }else{
      paint("r",{name:v[1]||"—",id,big:"0",cap:"لا يوجد رصيد متبقٍ",meta});
    }
    say($("#mFind"),"");
  }catch(e){say($("#mFind"),esc(e.message),"bad")}
}

const EPOCH=Date.UTC(1899,11,30);
const nowSerial=()=>(Date.now()-new Date().getTimezoneOffset()*60000-EPOCH)/864e5;
const xlDate=x=>{const d=new Date(EPOCH+x*864e5),p=n=>String(n).padStart(2,"0");return `${p(d.getUTCDate())}/${p(d.getUTCMonth()+1)}/${d.getUTCFullYear()} ${p(d.getUTCHours())}:${p(d.getUTCMinutes())}`};
async function confirmSave(){
  if(!HIT)return;
  const a=num($("#amt").value), ev=$("#evt").value;
  if(EVENTS.length&&!ev){say($("#mSave"),"اختر الفعالية أولاً (أعلى الصفحة)","bad");return}
  if(a<=0){say($("#mSave"),"اكتب مبلغًا أكبر من صفر","bad");return}
  if(a>HIT.rem){say($("#mSave"),`المبلغ أكبر من الرصيد المتبقي (${fmt(HIT.rem)})`,"bad");return}
  $("#bConfirm").disabled=true; busy($("#mSave"),"جارٍ الكتابة في الملف…");
  try{
    const u=await api(`${SH(CFG.logSheet)}/usedRange(valuesOnly=true)?$select=address`);
    const last=+((/(\d+)$/.exec(u.address||"")||[0,1])[1]);
    const r=Math.max(last,1)+1;
    if(r>5001)throw new Error("سجل المقاعد ممتلئ (5000 سطر).");
    await api(`${SH(CFG.logSheet)}/range(address='A${r}:F${r}')`,
      {method:"PATCH",body:JSON.stringify({values:[[nowSerial(),HIT.id,HIT.name,a,ev,""]]})});
    items.unshift({id:HIT.id,n:HIT.name,a,ev,t:new Date().toLocaleTimeString("ar",{hour:"2-digit",minute:"2-digit"})});
    renderLog();
    say($("#mSave"),`✓ سُجّل ${fmt(a)} — المتبقي الآن ${fmt(HIT.rem-a)}`,"");
    ROWS=null;
    const id=HIT.id; clearResult();
    setTimeout(()=>lookup(id),600);
    if(navigator.vibrate)navigator.vibrate([40,60,40]);
  }catch(e){say($("#mSave"),esc(e.message),"bad")}
  finally{$("#bConfirm").disabled=false}
}

/* ═══════════════ الكاميرا ═══════════════ */
let qr=null,stream=null,raf=null,last="",lastAt=0;
function loadQR(){
  const urls=["https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js",
              "https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js",
              "https://unpkg.com/jsqr@1.4.0/dist/jsQR.js"];
  return new Promise((res,rej)=>{let i=0;
    const go=()=>{if(i>=urls.length)return rej(new Error("تعذّر تحميل مكتبة القراءة"));
      const s=document.createElement("script");s.src=urls[i++];
      s.onload=()=>window.jsQR?res(window.jsQR):go();s.onerror=go;document.head.append(s)};
    go()});
}
const cv=document.createElement("canvas"),cx=cv.getContext("2d",{willReadFrequently:true});
function tick(){
  const v=$("#vid");
  if(v.readyState===v.HAVE_ENOUGH_DATA){
    const w=Math.min(v.videoWidth,640),h=Math.round(v.videoHeight*(w/v.videoWidth));
    cv.width=w;cv.height=h;cx.drawImage(v,0,0,w,h);
    try{
      const d=cx.getImageData(0,0,w,h);
      const r=qr(d.data,w,h,{inversionAttempts:"dontInvert"});
      if(r&&r.data){
        const id=clean(r.data),now=Date.now();
        if(!(id===last&&now-lastAt<3000)){last=id;lastAt=now;
          if(navigator.vibrate)navigator.vibrate(60);
          $("#idm").value=id; lookup(id);}
      }
    }catch(e){}
  }
  raf=requestAnimationFrame(tick);
}
async function camOn(){
  try{ if(!qr){$("#off").textContent="جارٍ تحميل المكتبة…";qr=await loadQR()} }
  catch(e){$("#off").textContent=e.message+" — استخدم الكتابة اليدوية.";return}
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"},audio:false});
    const v=$("#vid");v.srcObject=stream;await v.play();
    $("#off").style.display="none";$("#frm").classList.remove("hidden");
    $("#bCam").textContent="أوقف الكاميرا";tick();
  }catch(e){
    $("#off").style.display="flex";
    $("#off").textContent = e.name==="NotAllowedError" ? "رُفض إذن الكاميرا. اسمح بالوصول ثم أعد المحاولة."
      : e.name==="NotFoundError" ? "لا توجد كاميرا في هذا الجهاز."
      : "تعذّر تشغيل الكاميرا — استخدم الكتابة اليدوية.";
  }
}
function camOff(){
  if(raf)cancelAnimationFrame(raf);raf=null;
  if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;
  $("#vid").srcObject=null;$("#frm").classList.add("hidden");
  $("#off").style.display="flex";$("#off").textContent="اضغط «شغّل الكاميرا» لبدء المسح";
  $("#bCam").textContent="شغّل الكاميرا";
}

/* ═══════════════ الربط ═══════════════ */
$("#bLogin").onclick=login;
$("#bCam").onclick=()=>stream?camOff():camOn();
$("#bFind").onclick=()=>lookup($("#idm").value);
$("#idm").addEventListener("keydown",e=>{if(e.key==="Enter")lookup($("#idm").value)});
$("#idm").addEventListener("input",e=>{const p=e.target.selectionStart;
  e.target.value=e.target.value.toUpperCase();e.target.setSelectionRange(p,p)});
$("#bConfirm").onclick=confirmSave;
$("#evt").onchange=e=>{sessionStorage.gate_evt=e.target.value};
$("#bCancel").onclick=clearResult;
$("#amt").addEventListener("keydown",e=>{if(e.key==="Enter")confirmSave()});
$("#bSwitch").onclick=()=>{camOff();clearResult();ROWS=null;FILE=null;SUP=null;
  $("#idm").value="";renderPick();show("vPick")};

function renderPick(){
  $("#pick").innerHTML=CFG.suppliers.map((s,i)=>`<button data-i="${i}">${esc(s.name)}</button>`).join("");
  $("#pick").querySelectorAll("button").forEach(b=>b.onclick=async()=>{
    const s=CFG.suppliers[+b.dataset.i];
    busy($("#mPick"),`جارٍ فتح ملف ${esc(s.name)}…`);
    try{
      FILE=await openFile(s); SUP=s;
      $("#tSup").textContent=s.name;
      await loadEvents();
      say($("#mPick"),""); items.length=0; renderLog(); clearResult(); show("vScan");
    }catch(e){say($("#mPick"),esc(e.message),"bad")}
  });
}

(async function init(){
  renderLog();
  const back=await handleRedirect();
  if(S.t){ renderPick(); show("vPick"); }
  else show("vLogin");
})();
</script>
